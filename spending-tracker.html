<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Spend Log</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #e8e8e8;
    --muted: #666;
    --must: #4ade80;
    --nice: #fbbf24;
    --cut: #f87171;
    --accent: #818cf8;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    padding: 20px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .header h1 {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .header .month {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Summary bar */
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .summary-item {
    padding: 14px 16px;
    border-right: 1px solid var(--border);
  }
  .summary-item:last-child { border-right: none; }
  .summary-item .label {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .summary-item .amount {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 500;
  }
  .summary-item.must .amount { color: var(--must); }
  .summary-item.nice .amount { color: var(--nice); }
  .summary-item.cut .amount { color: var(--cut); }

  /* Input area */
  .input-area {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .note-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    resize: none;
    min-height: 48px;
    max-height: 120px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.4;
  }
  .note-input:focus { border-color: var(--accent); }
  .note-input::placeholder { color: var(--muted); font-size: 14px; }

  .mic-btn, .send-btn {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
    transition: all 0.15s;
  }
  .mic-btn {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .mic-btn:active, .mic-btn.recording {
    background: #3b0f0f;
    border-color: var(--cut);
    color: var(--cut);
    transform: scale(0.96);
  }
  .send-btn {
    background: var(--accent);
    color: #fff;
  }
  .send-btn:active { transform: scale(0.96); opacity: 0.9; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .parsing-indicator {
    display: none;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    padding: 8px 2px 0;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Sort/filter bar */
  .filter-bar {
    display: flex;
    gap: 0;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-btn {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .filter-btn.active {
    background: var(--surface2);
    border-color: var(--border);
    color: var(--text);
  }

  /* Entries list */
  .entries {
    padding: 8px 0 100px;
  }

  .entry {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 0;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    animation: slideIn 0.25s ease-out;
    position: relative;
    align-items: start;
  }
  @keyframes slideIn {
    from { opacity:0; transform: translateY(-6px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .entry-priority {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding-top: 2px;
  }
  .priority-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .priority-dot.must { background: var(--must); }
  .priority-dot.nice { background: var(--nice); }
  .priority-dot.cut  { background: var(--cut); }

  .recur-tag {
    font-family: var(--mono);
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }

  .entry-body { flex: 1; }
  .entry-desc {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .entry-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tag {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .tag.category { color: var(--accent); border-color: #3730a3; background: #1e1b4b; }

  .entry-amount {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    text-align: right;
    padding-top: 2px;
  }

  .delete-btn {
    position: absolute;
    right: 8px;
    bottom: 8px;
    background: none;
    border: none;
    color: var(--border);
    cursor: pointer;
    font-size: 11px;
    padding: 4px;
    border-radius: 4px;
    transition: color 0.15s;
  }
  .delete-btn:hover { color: var(--cut); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
  .empty-state p { font-family: var(--mono); font-size: 12px; line-height: 1.8; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    transition: transform 0.3s ease;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Sort label */
  .sort-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 16px 4px;
  }

  @media (max-width: 400px) {
    .summary-item .amount { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>spend/log</h1>
  <span class="month" id="currentMonth"></span>
</div>

<div class="summary">
  <div class="summary-item must">
    <div class="label">Must</div>
    <div class="amount" id="mustTotal">$0.00</div>
  </div>
  <div class="summary-item nice">
    <div class="label">Nice</div>
    <div class="amount" id="niceTotal">$0.00</div>
  </div>
  <div class="summary-item cut">
    <div class="label">Cut</div>
    <div class="amount" id="cutTotal">$0.00</div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <button class="mic-btn" id="micBtn" title="Voice input">🎙️</button>
    <textarea class="note-input" id="noteInput" placeholder="e.g. spent $5.26 on lunch, nice to have, one time, food" rows="1"></textarea>
    <button class="send-btn" id="sendBtn" title="Log it">↑</button>
  </div>
  <div class="parsing-indicator" id="parsingIndicator">⬡ parsing...</div>
</div>

<div class="filter-bar">
  <button class="filter-btn active" data-sort="date">Latest</button>
  <button class="filter-btn" data-sort="amount-desc">$ High→Low</button>
  <button class="filter-btn" data-sort="amount-asc">$ Low→High</button>
  <button class="filter-btn" data-sort="must">Must-Haves</button>
  <button class="filter-btn" data-sort="nice">Nice-to-Haves</button>
  <button class="filter-btn" data-sort="cut">Can Cut</button>
  <button class="filter-btn" data-sort="recurring">Recurring</button>
</div>

<div class="entries" id="entriesList"></div>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = ['Food','Fun','Transportation','Bills','Rent','Travel','Gifts','Mistakes','Other'];
const PRIORITY_MAP = { must: 'must', nice: 'nice', cut: 'cut' };

let entries = JSON.parse(localStorage.getItem('spendlog_entries') || '[]');
let currentSort = 'date';

// Month label
document.getElementById('currentMonth').textContent =
  new Date().toLocaleString('default', { month: 'long', year: 'numeric' });

function save() {
  localStorage.setItem('spendlog_entries', JSON.stringify(entries));
}

function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ── AI parsing ──────────────────────────────────────────────────────────────
async function parseNote(text) {
  const prompt = `You are a spending log parser. Parse the user's note into structured data.

Categories available: Food, Fun, Transportation, Bills, Rent, Travel, Gifts, Mistakes, Other

Return ONLY valid JSON (no markdown, no extra text) in this exact format:
{
  "amount": 5.26,
  "description": "lunch",
  "priority": "nice",
  "recurrence": "one-time",
  "category": "Food"
}

Rules:
- amount: number, dollars (extract from text)
- description: short phrase of what was purchased
- priority: exactly one of "must", "nice", or "cut"
  - "must" = essential/necessary/need
  - "nice" = nice to have/want/optional treat
  - "cut" = could cut/unnecessary/wasteful/mistake
- recurrence: exactly "one-time" or "recurring"
- category: best match from the list above

User note: "${text}"`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 300,
      messages: [{ role: 'user', content: prompt }]
    })
  });

  const data = await res.json();
  const raw = data.content?.[0]?.text || '';
  // Strip any markdown fences just in case
  const clean = raw.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

// ── Render ───────────────────────────────────────────────────────────────────
function getSorted() {
  let list = [...entries];
  if (currentSort === 'amount-desc') list.sort((a,b) => b.amount - a.amount);
  else if (currentSort === 'amount-asc') list.sort((a,b) => a.amount - b.amount);
  else if (currentSort === 'must') list = list.filter(e => e.priority === 'must').sort((a,b) => b.amount - a.amount);
  else if (currentSort === 'nice') list = list.filter(e => e.priority === 'nice').sort((a,b) => b.amount - a.amount);
  else if (currentSort === 'cut') list = list.filter(e => e.priority === 'cut').sort((a,b) => b.amount - a.amount);
  else if (currentSort === 'recurring') list = list.filter(e => e.recurrence === 'recurring').sort((a,b) => b.amount - a.amount);
  else list.sort((a,b) => b.id - a.id); // date
  return list;
}

function render() {
  const list = getSorted();

  // Totals (always from all entries)
  const must = entries.filter(e=>e.priority==='must').reduce((s,e)=>s+e.amount,0);
  const nice = entries.filter(e=>e.priority==='nice').reduce((s,e)=>s+e.amount,0);
  const cut  = entries.filter(e=>e.priority==='cut').reduce((s,e)=>s+e.amount,0);
  document.getElementById('mustTotal').textContent = '$' + must.toFixed(2);
  document.getElementById('niceTotal').textContent = '$' + nice.toFixed(2);
  document.getElementById('cutTotal').textContent  = '$' + cut.toFixed(2);

  const container = document.getElementById('entriesList');

  if (list.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="icon">🧾</div>
      <p>No entries yet.<br>Type or speak a purchase above.</p>
    </div>`;
    return;
  }

  container.innerHTML = list.map(e => `
    <div class="entry" data-id="${e.id}">
      <div class="entry-priority">
        <div class="priority-dot ${e.priority}"></div>
        <span class="recur-tag">${e.recurrence === 'recurring' ? '↺' : '1×'}</span>
      </div>
      <div class="entry-body">
        <div class="entry-desc">${e.description}</div>
        <div class="entry-meta">
          <span class="tag priority-label">${e.priority === 'must' ? 'Must' : e.priority === 'nice' ? 'Nice' : 'Cut'}</span>
          <span class="tag">${e.recurrence}</span>
          <span class="tag category">${e.category}</span>
        </div>
      </div>
      <div class="entry-amount">$${e.amount.toFixed(2)}</div>
      <button class="delete-btn" onclick="deleteEntry(${e.id})">✕</button>
    </div>
  `).join('');
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  save();
  render();
}

// ── Submit ────────────────────────────────────────────────────────────────────
async function submitNote() {
  const input = document.getElementById('noteInput');
  const text = input.value.trim();
  if (!text) return;

  const sendBtn = document.getElementById('sendBtn');
  const indicator = document.getElementById('parsingIndicator');

  sendBtn.disabled = true;
  indicator.style.display = 'block';

  try {
    const parsed = await parseNote(text);

    const entry = {
      id: Date.now(),
      amount: parseFloat(parsed.amount) || 0,
      description: parsed.description || text,
      priority: parsed.priority || 'nice',
      recurrence: parsed.recurrence || 'one-time',
      category: parsed.category || 'Other',
      raw: text
    };

    entries.unshift(entry);
    save();
    input.value = '';
    input.style.height = 'auto';
    render();
    showToast(`✓ Logged $${entry.amount.toFixed(2)} · ${entry.category}`);
  } catch (err) {
    showToast('⚠ Could not parse — try again');
    console.error(err);
  } finally {
    sendBtn.disabled = false;
    indicator.style.display = 'none';
  }
}

// ── Voice input ───────────────────────────────────────────────────────────────
let recognition = null;
const micBtn = document.getElementById('micBtn');

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    document.getElementById('noteInput').value = transcript;
    micBtn.classList.remove('recording');
    submitNote();
  };
  recognition.onend = () => micBtn.classList.remove('recording');
  recognition.onerror = () => {
    micBtn.classList.remove('recording');
    showToast('Microphone error — type instead');
  };

  micBtn.addEventListener('click', () => {
    if (micBtn.classList.contains('recording')) {
      recognition.stop();
    } else {
      micBtn.classList.add('recording');
      recognition.start();
    }
  });
} else {
  micBtn.title = 'Voice not supported — type instead';
  micBtn.style.opacity = '0.4';
}

// ── Events ────────────────────────────────────────────────────────────────────
document.getElementById('sendBtn').addEventListener('click', submitNote);

document.getElementById('noteInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitNote(); }
});

// Auto-resize textarea
document.getElementById('noteInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.dataset.sort;
    render();
  });
});

// Initial render
render();
</script>
</body>
</html>
